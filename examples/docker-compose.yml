# Local dev stack for the streaming + S3 + scheduler examples.
#
# Brings up:
#   - postgres:16-alpine on :5432, db=postgres / user=postgres / pw=postgres
#   - kafka (KRaft mode, no Zookeeper) on :9092
#   - minio on :9000 (S3 API) + :9001 (web console)
#     creds: minioadmin / minioadmin (set via env below)
#   - minio-init: one-shot, creates the `ematix-demo` bucket and exits
#
# `docker compose up -d` to start. `docker compose down -v` to wipe.
#
# Topics aren't auto-created — Kafka's broker default `auto.create.topics.enable=true`
# (the apache/kafka image's default) lets the first produce call create
# the topic. For deterministic schemas, create them explicitly:
#
#   docker compose exec kafka /opt/kafka/bin/kafka-topics.sh \
#       --bootstrap-server localhost:9092 \
#       --create --topic events --partitions 1 --replication-factor 1

services:
  postgres:
    image: postgres:16-alpine
    container_name: ematix-flow-pg
    environment:
      POSTGRES_PASSWORD: postgres
    # Host port 5434 (not 5432) to avoid colliding with brew-installed /
    # system Postgres. Inside-container clients (`docker exec ...`)
    # still use 5432 — only host-network demos see 5434.
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:3.8.0
    container_name: ematix-flow-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: ematix-flow-cluster-id

  # S3-API-compatible object store. Demo 11 uses this as the "S3
  # without AWS" source. Web console at http://localhost:9001 (same
  # creds) shows buckets + uploaded files visually.
  minio:
    image: minio/minio:latest
    container_name: ematix-flow-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  # One-shot: create the `ematix-demo` bucket after MinIO is healthy,
  # then exit. The `mc` CLI ships in the minio/mc image. Idempotent
  # — re-running this is a no-op on an existing bucket.
  minio-init:
    image: minio/mc:latest
    container_name: ematix-flow-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/ematix-demo &&
      echo 'bucket ematix-demo ready'
      "
