name: docs

# Builds + deploys the mkdocs site to GitHub Pages on every push to
# main. PR builds run mkdocs but skip the deploy step — useful for
# catching broken links or markdown rendering issues before merge.
#
# One-time setup (Repository Settings → Pages):
#   Source = GitHub Actions

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, but don't cancel
# in-progress deploys — they'd leave the site half-deployed.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history so `edit_uri` + git-based plugins
          # (revision-date, contributors) have something to read.
          # Cheap on this repo's size.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mkdocs
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material 'mkdocs>=1.6'

      - name: Build site
        run: mkdocs build --strict

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
