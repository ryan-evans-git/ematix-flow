name: docs

# Builds + deploys the mkdocs site to GitHub Pages on every push to
# main. PR builds run mkdocs but skip the deploy step — useful for
# catching broken links or markdown rendering issues before merge.
#
# One-time setup (Repository Settings → Pages):
#   Source = GitHub Actions

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Per-ref concurrency: a new push to the same branch supersedes
    # the previous build (saves CI), but PR builds and pushes on
    # *different* refs run independently so sibling PRs don't cancel
    # each other's required "build" check.
    concurrency:
      group: docs-build-${{ github.ref }}
      cancel-in-progress: true
    # `build` is a required branch-protection check — the job must
    # always run and produce a status. The actual mkdocs build is
    # gated on whether docs / config / README files changed in this
    # PR (per-step `if:` on `steps.changes.outputs.docs`). Push to
    # main always builds because that path also feeds the deploy.
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history so `edit_uri` + git-based plugins
          # (revision-date, contributors) have something to read.
          # Cheap on this repo's size.
          fetch-depth: 0

      - name: Detect docs / config changes
        id: changes
        # On push events (e.g. main), `dorny/paths-filter` falls back
        # to comparing against the previous commit. We want push-to-
        # main to always build so it can deploy, so force `docs=true`
        # for non-PR events.
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
              - '**/*.md'
              - '.github/workflows/docs.yml'

      - name: Decide whether to build
        id: gate
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ steps.changes.outputs.docs }}" == "true" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "No docs/markdown/config changes — skipping mkdocs build."
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.build == 'true'
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4
        if: steps.gate.outputs.build == 'true'
        with:
          enable-cache: true
          # No uv.lock in this repo (we don't lock Python deps) —
          # override the default `**/uv.lock` glob, which fails the
          # action when no match is found.
          cache-dependency-glob: ".github/workflows/docs.yml"

      - name: Install mkdocs
        if: steps.gate.outputs.build == 'true'
        run: |
          uv venv .venv --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          uv pip install mkdocs-material 'mkdocs>=1.6'

      - name: Build site
        if: steps.gate.outputs.build == 'true'
        run: mkdocs build --strict

      - name: Upload artifact
        # Deploy step (in `deploy` job below) consumes this; only
        # uploaded on push events when build actually ran.
        if: github.event_name != 'pull_request' && steps.gate.outputs.build == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # Pages allows only one concurrent deployment site-wide. Don't
    # cancel in-progress deploys — they'd leave the site half-published.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
