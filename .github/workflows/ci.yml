name: ci

# Linux-only matrix on purpose: macOS GitHub-hosted runners are
# billed at 10× the Linux rate. The release.yml workflow still
# builds macOS (Apple Silicon) wheels — that's where macOS coverage
# actually matters.

on:
  push:
    branches: [main, master]
  pull_request:
  # `merge_group` fires on the synthetic `gh-readonly-queue/<base>/<sha>`
  # refs the GitHub merge queue creates when a PR is added. Required so
  # the queue's pre-merge CI run actually exercises the workflows;
  # without this trigger the required-status-check set comes back empty
  # and queued PRs sit forever. The PR-time `pull_request` trigger
  # continues to gate the PR itself — `merge_group` is the *additional*
  # post-queue gate.
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Use the `mold` linker for all Rust builds. mold is 5-10× faster than
  # GNU ld on large binaries (this project's full dep graph includes
  # DataFusion + Arrow + Cranelift + DeltaLake — ~30-60s of linking
  # per build). Set globally on the workflow so every Rust step
  # (clippy, test, maturin develop, audit installs) benefits without
  # per-job opt-in. Installed via `rui314/setup-mold@v1` in each
  # Rust-using job below.
  RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

jobs:
  # Fast static guards (no Rust toolchain). Keep these cheap so they fail
  # in seconds, before the expensive build/test jobs.
  guards:
    name: static guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ematix-parquet must be the ONLY parquet scan path in shipped runtime
      # code — a silent drift to arrow-rs `register_parquet` is what made the
      # AWS TPC-H campaign under-measure the engine. The guard self-tests its
      # own comment/string/cfg(test) stripping first, then scans crates/*/src.
      - name: Forbid arrow-rs register_parquet in shipped runtime code
        run: |
          python3 scripts/ci/forbid_runtime_register_parquet.py --self-test
          python3 scripts/ci/forbid_runtime_register_parquet.py --root .

  rust:
    name: rust (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rui314/setup-mold@v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # cargo-nextest runs tests in parallel with per-test process
      # isolation and smarter scheduling. On this codebase's 700-test
      # suite it cuts test-execution time ~30-50% vs `cargo test`'s
      # serial-within-binary model. Installed precompiled via the
      # taiki-e action (~3s vs ~2 min `cargo install`).
      - uses: taiki-e/install-action@nextest
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run unit + integration tests (nextest)
        # `--tests` (not `--all-targets`) intentionally: nextest enumerates
        # each target via `--list`, and any bench whose module-init prints
        # diagnostic lines (e.g. `examples/tpch/bench` printing data-dir
        # info) breaks the "<name>: test" parse and fails the whole step.
        # `--tests` filters to lib + integration test targets, matching
        # integration.yml's working invocation. Compilation of benches /
        # examples is still verified by the separate `cargo clippy
        # --all-targets` step above. Doctests aren't run by nextest; if
        # the project ever adds load-bearing doctests they'd need a
        # separate `cargo test --doc` step here.
        run: cargo nextest run --workspace --tests

  audit-rust:
    name: cargo audit (RustSec advisory DB)
    runs-on: ubuntu-latest
    # Required branch-protection check — must always run and produce
    # a status. The actual audit (which installs cargo-audit and
    # scans the lock file) is gated on whether Rust dep manifests
    # actually changed in this PR; non-dep-touching PRs get a fast
    # no-op so the required check stays green without burning ~2 min
    # of `cargo install` + audit time.
    steps:
      - uses: actions/checkout@v4
      - name: Detect Cargo manifest changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            deps:
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/audit.toml'
      - if: steps.changes.outputs.deps == 'true'
        uses: rui314/setup-mold@v1
      - if: steps.changes.outputs.deps == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.changes.outputs.deps == 'true'
        uses: Swatinem/rust-cache@v2
      # Shell-based cargo audit instead of the `rustsec/audit-check`
      # action — that one tries to post a GitHub Check Run, which
      # needs `checks: write` permission. Granting that to the whole
      # workflow expands the privilege surface; running the binary
      # directly is just as effective. `cargo audit` checks
      # `Cargo.lock` against the RustSec advisory DB and exits
      # non-zero on any non-ignored vulnerability. `.cargo/audit.toml`
      # lists ignored advisory IDs with rationale. Unmaintained
      # warnings don't fail CI — they're informational.
      - if: steps.changes.outputs.deps == 'true'
        name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - if: steps.changes.outputs.deps == 'true'
        name: Run cargo audit
        run: cargo audit
      - if: steps.changes.outputs.deps != 'true'
        name: Skip — no Cargo manifest changes
        run: echo "No '**/Cargo.toml', 'Cargo.lock', or audit config changes — skipping audit."

  python:
    name: python (ubuntu-latest, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        # Tests every Python version we ship a wheel for (see
        # release.yml's build-linux/build-macos matrices). Keeping
        # ci + release in lockstep prevents accidentally publishing
        # a wheel for a Python the test suite has never run on.
        #
        # PR-time matrix narrowed to the two required branch-protection
        # versions (py3.11 + py3.12). Push to main expands to the full
        # 3.11→3.14 sweep so a regression on 3.13 / 3.14 still trips
        # before a release tag is cut. Saves ~50 % Python CI minutes
        # per PR without weakening the release gate.
        python: ${{ fromJSON(github.event_name == 'pull_request' && '["3.11","3.12"]' || '["3.11","3.12","3.13","3.14"]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - uses: rui314/setup-mold@v1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `maturin develop` requires an active virtualenv (it refuses
      # to install into the system Python). `uv venv` creates one
      # ~10× faster than `python -m venv`; persist its bin/ on PATH
      # and VIRTUAL_ENV across subsequent steps via $GITHUB_PATH /
      # $GITHUB_ENV so every later `python` / `uv` / `maturin` /
      # `pytest` invocation resolves through it.
      - name: Set up venv
        shell: bash
        run: |
          uv venv .venv --python ${{ matrix.python }}
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
      - name: Install dev deps
        # uv is dramatically faster than pip on heavy scientific
        # wheels (numpy, pyarrow, pandas) — it parallelises
        # downloads and uses a local content-addressed cache. The
        # `setup-uv` action's cache key is keyed on `pyproject.toml`
        # so cross-job reruns hit the warm cache.
        run: |
          uv pip install 'maturin>=1.7' pytest 'pytest-asyncio>=0.23' \
            ruff bandit pip-audit pip-licenses numpy 'pyarrow>=15' \
            'pandas>=2.0'
      - name: Build extension
        # CI builds the Python extension in debug (not release) mode.
        # The release build was originally chosen for perf parity with
        # shipping wheels, but CI tests only assert correctness — and
        # release codegen on this dep graph (DataFusion + Arrow +
        # Cranelift) takes ~5-8 min vs ~1-2 min in debug. The shipping
        # wheels themselves are still built in release by release.yml's
        # maturin invocation; this only affects CI smoke tests.
        run: maturin develop
      - name: Lint
        run: ruff check python tests
      - name: Bandit (medium+ severity, no findings allowed)
        run: bandit -r python -ll -c pyproject.toml
      - name: pip-audit (Python deps)
        # `--skip-editable` excludes the in-tree `ematix-flow`
        # install (maturin develop creates an editable install
        # that pip-audit can't look up on PyPI yet). Default
        # behavior fails on any advisory in the non-editable deps;
        # `--strict` would treat the editable skip itself as a
        # failure, which we don't want.
        run: pip-audit --skip-editable
      - name: License check (block GPL/AGPL/SSPL/BUSL/Elastic/Commons Clause)
        # Substring match against each Python dep's declared license
        # string. Exact forms picked to avoid false-matching LGPL
        # (weak-copyleft, OK for runtime/dynamic linking) or MPL
        # (file-level copyleft, currently allowed). Tighten by adding
        # entries to the list if policy changes. Runs after `maturin
        # develop` so every transitive runtime + dev dep is resolved.
        run: |
          pip-licenses --fail-on="GPL-2.0;GPL-3.0;GPLv2;GPLv3;AGPL;Affero;SSPL;Server Side Public;BUSL;Business Source;Elastic License;Commons Clause"
      - name: Test
        run: pytest

  license-rust:
    name: license check (rust deps)
    runs-on: ubuntu-latest
    # Independent of the rust + audit jobs so a license regression
    # surfaces with a distinct check name. Uses cargo-deny because it
    # parses SPDX expressions correctly (handles `OR` / `AND` /
    # `WITH`) — a substring grep over `cargo-license` output would
    # mis-classify dual-licensed crates.
    #
    # Not a required branch-protection check, so the whole job is
    # gated on Cargo manifest changes — PRs that don't touch deps
    # don't run cargo-deny at all (saves ~1 min install + check).
    steps:
      - uses: actions/checkout@v4
      - name: Detect Cargo manifest changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            deps:
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
      - if: steps.changes.outputs.deps == 'true'
        uses: rui314/setup-mold@v1
      - if: steps.changes.outputs.deps == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.changes.outputs.deps == 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.changes.outputs.deps == 'true'
        name: Install cargo-deny
        run: cargo install --locked cargo-deny
      - if: steps.changes.outputs.deps == 'true'
        name: Run cargo deny check licenses
        # `deny.toml` at the repo root lists the forbidden SPDX IDs
        # (GPL/AGPL/SSPL/BUSL/Elastic/Commons-Clause) and the allowed
        # set. Only the `licenses` table is enforced here; the
        # advisories table is covered by the separate `audit-rust`
        # job, and `bans`/`sources` are left at defaults.
        run: cargo deny check licenses
      - if: steps.changes.outputs.deps != 'true'
        name: Skip — no Cargo manifest changes
        run: echo "No '**/Cargo.toml', 'Cargo.lock', or 'deny.toml' changes — skipping license check."
