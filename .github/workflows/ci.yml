name: ci

# Linux-only matrix on purpose: macOS GitHub-hosted runners are
# billed at 10× the Linux rate. The release.yml workflow still
# builds macOS (Apple Silicon) wheels — that's where macOS coverage
# actually matters.

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: rust (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets

  audit-rust:
    name: cargo audit (RustSec advisory DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Shell-based cargo audit instead of the `rustsec/audit-check`
      # action — that one tries to post a GitHub Check Run, which
      # needs `checks: write` permission. Granting that to the whole
      # workflow expands the privilege surface; running the binary
      # directly is just as effective. `cargo audit` checks
      # `Cargo.lock` against the RustSec advisory DB and exits
      # non-zero on any non-ignored vulnerability. `.cargo/audit.toml`
      # lists ignored advisory IDs with rationale. Unmaintained
      # warnings don't fail CI — they're informational.
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: Run cargo audit
        run: cargo audit

  python:
    name: python (ubuntu-latest, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `maturin develop` requires an active virtualenv (it refuses
      # to install into the system Python). Create one + persist its
      # bin/ on PATH and VIRTUAL_ENV across subsequent steps via
      # $GITHUB_PATH / $GITHUB_ENV so every later `python` /
      # `pip` / `maturin` / `pytest` invocation resolves through it.
      - name: Set up venv
        shell: bash
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install 'maturin>=1.7' pytest 'pytest-asyncio>=0.23' ruff bandit pip-audit pip-licenses
      - name: Build extension
        run: maturin develop --release
      - name: Lint
        run: ruff check python tests
      - name: Bandit (medium+ severity, no findings allowed)
        run: bandit -r python -ll -c pyproject.toml
      - name: pip-audit (Python deps)
        # `--skip-editable` excludes the in-tree `ematix-flow`
        # install (maturin develop creates an editable install
        # that pip-audit can't look up on PyPI yet). Default
        # behavior fails on any advisory in the non-editable deps;
        # `--strict` would treat the editable skip itself as a
        # failure, which we don't want.
        run: pip-audit --skip-editable
      - name: License check (block GPL/AGPL/SSPL/BUSL/Elastic/Commons Clause)
        # Substring match against each Python dep's declared license
        # string. Exact forms picked to avoid false-matching LGPL
        # (weak-copyleft, OK for runtime/dynamic linking) or MPL
        # (file-level copyleft, currently allowed). Tighten by adding
        # entries to the list if policy changes. Runs after `maturin
        # develop` so every transitive runtime + dev dep is resolved.
        run: |
          pip-licenses --fail-on="GPL-2.0;GPL-3.0;GPLv2;GPLv3;AGPL;Affero;SSPL;Server Side Public;BUSL;Business Source;Elastic License;Commons Clause"
      - name: Test
        run: pytest

  license-rust:
    name: license check (rust deps)
    runs-on: ubuntu-latest
    # Independent of the rust + audit jobs so a license regression
    # surfaces with a distinct check name. Uses cargo-deny because it
    # parses SPDX expressions correctly (handles `OR` / `AND` /
    # `WITH`) — a substring grep over `cargo-license` output would
    # mis-classify dual-licensed crates.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      - name: Run cargo deny check licenses
        # `deny.toml` at the repo root lists the forbidden SPDX IDs
        # (GPL/AGPL/SSPL/BUSL/Elastic/Commons-Clause) and the allowed
        # set. Only the `licenses` table is enforced here; the
        # advisories table is covered by the separate `audit-rust`
        # job, and `bans`/`sources` are left at defaults.
        run: cargo deny check licenses
