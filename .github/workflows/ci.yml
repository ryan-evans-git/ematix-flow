name: ci

# Linux-only matrix on purpose: macOS GitHub-hosted runners are
# billed at 10× the Linux rate for private repos, and ci.yml runs
# on every push + PR. The release.yml workflow still builds macOS
# (Apple Silicon) wheels — that's where macOS coverage actually
# matters. Until the repo goes public (free unlimited Actions
# minutes), this matrix stays linux-only.

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: rust (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets

  python:
    name: python (ubuntu-latest, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `maturin develop` requires an active virtualenv (it refuses
      # to install into the system Python). Create one + persist its
      # bin/ on PATH and VIRTUAL_ENV across subsequent steps via
      # $GITHUB_PATH / $GITHUB_ENV so every later `python` /
      # `pip` / `maturin` / `pytest` invocation resolves through it.
      - name: Set up venv
        shell: bash
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install 'maturin>=1.7' pytest 'pytest-asyncio>=0.23' ruff
      - name: Build extension
        run: maturin develop --release
      - name: Lint
        run: ruff check python tests
      - name: Test
        run: pytest
