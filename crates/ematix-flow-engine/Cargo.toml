[package]
name = "ematix-flow-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Clean-room, push-based, DataFusion-free analytical engine (see docs/plans/NATIVE_ENGINE.md)."

[dependencies]
# P0 decode SOURCE only. We use the `parquet` crate's LOW-LEVEL column
# reader (typed physical values via `ColumnReader`) — NOT its arrow
# reader, so no `arrow::Array` ever crosses into the engine's data path.
# The clean-room commitment ("no Arrow substrate") is enforced in code:
# scan.rs touches only `parquet::column::reader`. Replaced by
# ematix-parquet's native-vector decode in P1.
parquet = { workspace = true }
# The proven adaptive probe structure (dense byte-set/payload vs hash) —
# a pure kernel with no DataFusion/Arrow dep, so reusing it keeps the
# engine clean-room. The engine adds its own `probe_narrow` operator over
# the engine's `DataChunk` (see src/join.rs).
ematix-flow-push = { path = "../ematix-flow-push" }
