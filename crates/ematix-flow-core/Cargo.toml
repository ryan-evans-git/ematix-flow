[package]
name = "ematix-flow-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Rust core for ematix-flow: declarative table management + load strategies (append / truncate / merge / SCD2) for SQL databases, object stores + Delta Lake, and streaming sources."

[lib]
name = "ematix_flow_core"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
deadpool-postgres.workspace = true
uuid.workspace = true
futures-util.workspace = true
bytes.workspace = true
async-trait = "0.1"
# Π.4a: CsvReadOptions.null_regex compiles to a regex::Regex which
# the arrow-csv reader's with_null_regex consumes.
regex = "1"
# Σ.E5 (2026-05-19): memchr::memmem provides SIMD-accelerated
# substring search (two-way + AVX2/NEON). Used by the like_matcher
# module to evaluate LIKE patterns Photon-style on raw byte slices.
memchr = "2"
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
arrow-csv = { workspace = true }
arrow-json = { workspace = true }
arrow-cast = { workspace = true }
orc-rust = { workspace = true }
duckdb = { workspace = true }
rusqlite = { workspace = true }
mysql_async = { workspace = true }
object_store = { workspace = true }
# Σ.E5.5 (2026-05-18): removed `parquet = { workspace = true }`.
# All in-crate `parquet::` references now go through DataFusion's
# re-export (`datafusion::parquet::…`). Eliminates the direct
# workspace edge to parquet-rs as a flow-side dep. The transitive
# dep via DataFusion remains — DF's own Parquet integration still
# uses parquet-rs internally, and the surface we hit (writer,
# metadata, reader) is exactly what DF re-exports.
# ematix-parquet sibling repo — hand-rolled parquet decoder with
# NEON-fused predicate kernels. Wired into `ematix_parquet_bridge`
# to produce Arrow arrays from column chunks without going through
# parquet-rs's ParquetRecordBatchReader. Long-term: alternate backend
# for FastParquetExec.
# TEMPORARY (Σ.E5.6 alloc-churn experiment, 2026-05-18): path overrides
# to the sibling repo so we can test `ParquetFile::read_range_into`
# (a buffer-reuse API being prototyped for v0.11.0). Revert these
# back to version pins before merging — and bump to 0.11.0 once that
# release ships the API.
ematix-parquet-codec = { path = "../../../ematix-parquet/crates/ematix-parquet-codec" }
ematix-parquet-format = { path = "../../../ematix-parquet/crates/ematix-parquet-format" }
ematix-parquet-io = { path = "../../../ematix-parquet/crates/ematix-parquet-io" }
deltalake = { workspace = true }
datafusion = { workspace = true }
cranelift = { workspace = true }
cranelift-codegen = { workspace = true }
cranelift-frontend = { workspace = true }
cranelift-jit = { workspace = true }
cranelift-module = { workspace = true }
cranelift-native = { workspace = true }
url = { workspace = true }
rdkafka = { workspace = true }
# Direct dep so the resolver activates the `vendored` (via `plain`
# + `scram`) features on the same `sasl2-sys` instance that
# `rdkafka-sys` pulls in transitively. Without this, sasl2-sys's
# build script searches for a system libsasl2 at compile time and
# fails inside the manylinux2014 wheel-build container.
sasl2-sys = { workspace = true }
aws-msk-iam-sasl-signer = { workspace = true }
aws-types = { workspace = true }
prometheus = { workspace = true }
schema_registry_converter = { workspace = true }
apache-avro = { workspace = true }
protofish = { workspace = true }
lapin = { workspace = true }
google-cloud-pubsub = { workspace = true }
google-cloud-auth = { workspace = true }
aws-sdk-kinesis = { workspace = true }
aws-config = { workspace = true }
aws-credential-types = { workspace = true }
hyperloglogplus = { workspace = true }
postcard = { workspace = true }
tracing = { workspace = true }
# Σ.A2 PR 2: AST parser + visitor for the Spark/DuckDB→DataFusion
# translator. Promoted to a direct dep (was only transitive via
# DataFusion). See workspace.dependencies for the version-pinning
# rationale.
sqlparser = { workspace = true }

# Triangulation bench: `polars` is heavy to compile so we gate it
# behind the `triangulation` feature. `duckdb` is already a required
# workspace dep (used by `DuckDBBackend`), so no gating needed there.
# Cargo requires optional deps live in `[dependencies]` rather than
# `[dev-dependencies]`; the example `tpch_triangulation_bench` opts
# in via `required-features`.
polars = { version = "0.52", optional = true, default-features = false, features = ["sql", "lazy", "parquet", "dtype-date", "dtype-datetime", "dtype-decimal", "strings", "temporal"] }

[features]
# Run:
#   cargo run --release -p ematix-flow-core \
#     --example tpch_triangulation_bench --features triangulation
triangulation = ["dep:polars"]

[dev-dependencies]
arrow-array.workspace = true
testcontainers.workspace = true
testcontainers-modules.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# Used only by the Pub/Sub Docker integration tests to declare a
# topic + subscription on the emulator via its REST API.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tempfile = "3"
criterion = { workspace = true }
# Bench-only: hand-written `filter_record_batch` baseline used as
# the "<10% overhead vs raw" comparator for the DataFusion filter
# path. Pinned to the same major track as arrow-array so the ABI
# matches.
arrow-select = "58"
# Used by the TPC-H bench examples as `#[global_allocator]`. macOS's
# default malloc serializes on a global lock and was caught making
# Q13 SF=10 catastrophic (5.95s) under the high-concurrency, large-
# allocation pattern the v4-streaming change introduces; switching to
# mimalloc here turns Q13 into a +33% win (152 ms vs DF default 226 ms).
# Per-thread arenas + better fragmentation policy. Polars uses it too.
mimalloc = { version = "0.1", default-features = false }
# Σ.A1 PR 1: TPC-H generator + reference answers (used by the
# `tpch_smoke` integration test and the `tpch_generate` example).
# See workspace.dependencies for full rationale.
tpchgen = { workspace = true }

[[bench]]
name = "transform"
harness = false

# Σ.A1 PR 2: TPC-H bench harness for Q1/Q3/Q6/Q19 at SF=1. Reads
# Parquet from `examples/tpch/data/sf1/` (or `$TPCH_DATA_DIR`); fails
# fast if the data isn't generated. See `crates/ematix-flow-core/
# benches/tpch.rs` top-of-file comment for measurement-window tuning.
[[bench]]
name = "tpch"
harness = false

# Σ.A1 PR 1: bulk Parquet generator binary for the TPC-H benchmark
# harness. Idempotent — regenerates only if the target file is
# missing. SF=1 → ~1 GB compressed; SF=10 → ~10 GB. See
# `docs/PHASE_SIGMA_PLAN.md` Σ.A1 for the surrounding plan.
[[example]]
name = "tpch_generate"
path = "examples/tpch_generate.rs"

# Σ.A2 PR 4: TPC-DS dialect-translator audit. Plan-only check —
# translates each of the 99 official Spark TPC-DS queries through
# `dialect = "spark"`, hands the output to DataFusion's planner,
# reports per-query PASS / TRANSLATE_FAIL / PLAN_FAIL.
[[example]]
name = "tpcds_dialect_audit"
path = "examples/tpcds_dialect_audit.rs"

# Σ.E2 diagnostic: compare the in-memory Arrow array layout of the
# first batch from DataFusion's default parquet path vs the
# `FastParquetTableProvider`. Used to test whether Q01's persistent
# downstream slowdown comes from differing array encodings.
[[example]]
name = "fast_parquet_array_diff"
path = "examples/fast_parquet_array_diff.rs"

# Σ.G.2 / Σ.G.3 hand-vs-unified gate benches lived here until Σ.G.3d
# retired the hand operators they compared against. Their gates passed
# (4 consecutive runs within ±3 % on each shape); the work survives in
# the commit history and on the Σ.G.* PR series.

# Phase 3.5: Q14-shape SQL through 3 providers — register_parquet,
# FastParquetTableProvider, EmatixFastParquetTableProvider with the
# Phase 3 Date32 predicate pushdown. Measures wall-clock impact of
# the pushdown chain (Phase 5 fused-NEON + Phase 6 sparse-gather)
# end-to-end through DataFusion.
[[example]]
name = "tpch_q14_emat_provider_bench"
path = "examples/tpch_q14_emat_provider_bench.rs"

# Σ.D3 phase D (real): dump the DataFusion physical plan for Q6 to
# learn the exact node shape the SQL-pattern auto-injection rule
# needs to match.
[[example]]
name = "tpch_q6_plan_dump"
path = "examples/tpch_q6_plan_dump.rs"

# Σ.D3 phase D (real): bench Q6 with and without InjectFusedQ6Rule
# registered. Same SQL, only difference is whether the rule rewrites
# the Filter+Aggregate stack into a single FusedFilterSumExec.
[[example]]
name = "tpch_q6_inject_bench"
path = "examples/tpch_q6_inject_bench.rs"

# Σ.D3 phase D (Q3/Q5): dump canonical plan shapes for the
# post-join-aggregate rules.
[[example]]
name = "tpch_q3q5_plan_dump"
path = "examples/tpch_q3q5_plan_dump.rs"

# Σ.D3 phase D (Q12): dump canonical Q12 plan shape (join + complex
# filter + 2-group hash agg with CASE-WHEN over o_orderpriority).
[[example]]
name = "tpch_q12_plan_dump"
path = "examples/tpch_q12_plan_dump.rs"

# Σ.E2 follow-up: probe whether SF=1 lineitem.parquet has page-level
# column/offset indexes, and if so what fraction of pages overlap
# Q14's shipdate window. If overlap is small, page-index pruning is
# the lever to close the Q14 gap to Polars (cheaper than forking
# parquet-rs).
[[example]]
name = "parquet_page_index_probe"
path = "examples/parquet_page_index_probe.rs"

# Triangulation bench: run all 22 TPC-H queries through ematix-flow,
# DuckDB, and Polars in the same process on the same SF=1 parquet
# data; produce BENCHMARKS.md. Heavy deps (polars, duckdb) gated
# behind the `triangulation` feature.
[[example]]
name = "tpch_triangulation_bench"
path = "examples/tpch_triangulation_bench.rs"
required-features = ["triangulation"]

# Σ.E3b.1 bench: `COUNT(*) GROUP BY dict_col` —
# `DictGroupCountExec` vs DataFusion's default `AggregateExec` on a
# synthetic dict-encoded fixture sized to amplify the per-row hot
# loop (no I/O, no parquet decode — measures the agg kernel only).
[[example]]
name = "dict_group_count_bench"
path = "examples/dict_group_count_bench.rs"


# Σ.E3b diagnostic: do TPC-H string columns arrive at the Arrow
# surface as Dictionary(UInt32, Utf8)? Gates whether
# `EnableDictGroupCountRule` can ever fire on real parquet data.
[[example]]
name = "probe_dict_arrival"
path = "examples/probe_dict_arrival.rs"

# Σ.E5.4.a parity bench: 22-query TPC-H comparison of
# `FastParquetTableProvider` (parquet-rs) vs
# `EmatixFastParquetTableProvider` (ematix-parquet streaming reader,
# default since PR #115). Measures the per-query delta + geomean
# against E5.4's "within ±5% per-query, geomean ≤ 2% loss" acceptance
# criterion. Findings ship in
# `docs/PHASE_SIGMA_E5_4_22_PARITY_FINDINGS.md`.
[[example]]
name = "sigma_e5_4a_22_parity_bench"
path = "examples/sigma_e5_4a_22_parity_bench.rs"

# Σ.E5.2b dict-aware decode-gap diagnostics. Findings ship in
# `docs/PHASE_SIGMA_E5_2B_DICT_DECODE_DIAGNOSTIC.md`. Three examples,
# grouped by the `diag_dict_decode_` prefix:
#   1. e2e:     end-to-end SQL wall-clock + EXPLAIN ANALYZE diff
#                between FastParquet+dict and EmatixFastParquet+dict.
#   2. codec:   pure decode of `l_returnflag` across all RGs — strips
#                the provider, planner, and Arrow surface so the gap
#                attribution lands on the codec layer.
#   3. stages:  per-stage attribution inside ematix-parquet's
#                dict-preserved decode (read_range / page_walk / snappy
#                / dict_plain / rle_indices / assembly).
[[example]]
name = "diag_dict_decode_e2e"
path = "examples/diag_dict_decode_e2e.rs"

[[example]]
name = "diag_dict_decode_codec"
path = "examples/diag_dict_decode_codec.rs"

[[example]]
name = "diag_dict_decode_stages"
path = "examples/diag_dict_decode_stages.rs"
