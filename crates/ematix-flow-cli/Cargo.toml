[package]
name = "ematix-flow-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "CLI for running ematix-flow streaming pipelines."

[[bin]]
name = "flow"
path = "src/main.rs"

[lib]
name = "ematix_flow_cli"
path = "src/lib.rs"

[dependencies]
# Production-allocator parity with the benchmark (mimalloc per-thread heaps,
# no central malloc lock). ~10% on join/alloc-heavy queries. See the
# global_allocator in src/main.rs + the alloc_guard test.
mimalloc = { version = "0.1", default-features = false }
# WIN.SF100.SWEEP — `mi_collect(true)` at work-unit completion returns
# mimalloc-retained heap to the OS (run_shard.rs); retention measured
# 10-17GB across a SF=100 sweep, starving the page cache.
libmimalloc-sys = { version = "0.1", features = ["extended"] }
ematix-flow-core.workspace = true
# Σ.B PR 2 commit 5: CLI builds DistributedSqlTransform when
# `[transform] engine = "distributed"` is selected.
ematix-flow-distributed.workspace = true
clap = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = "0.1"
thiserror.workspace = true
axum = { workspace = true }
prometheus = { workspace = true }
# Π.4b-3: lookup-load helper streams Arrow batches into MemTables.
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
# Phase Z α: `flow run-shard` writes its partial result as Arrow IPC
# to the output URI; needs the FileWriter directly.
arrow-ipc = "58"
futures-util = { workspace = true }
# Σ.B PR 2 commit 4: validating `[transform] peers = [...]` URL
# well-formedness at config-load.
url = { workspace = true }
# Phase Z α: `flow run-shard` builds a DataFusion SessionContext to
# execute the query against the EmatixFastParquetTableProvider.
datafusion = { workspace = true }
# Phase Z α: e2e smoke test against the in-tree SF=1 fixture (when
# present) lives under `#[cfg(test)]` in run_shard.rs but the test
# also uses `tempfile` to scope the output. Promote to a main dep
# only the parts the production path needs; tempfile stays dev-only.

[dev-dependencies]
tempfile = "3"
# Σ.SC I.3: the worker-decode oracle tests write (id, val) parquet fixtures
# through the ematix codec — same fixture style as flow-core's sidecar tests.
ematix-parquet-codec = "0.17"
ematix-parquet-format = "0.17"
# Allocator-parity guard (test global_allocator_is_mimalloc in main.rs):
# mi_is_in_heap_region is behind the `extended` feature.
libmimalloc-sys = { version = "0.1", features = ["extended"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
rdkafka = { workspace = true }
ematix-flow-core = { workspace = true }
arrow-array = { workspace = true }
futures-util = { workspace = true }
# Π.5: tests construct trivial `ScalarUDFImpl` fixtures to verify
# the streaming-pipeline UDF threading; the production crate
# doesn't itself need a direct DataFusion dep.
datafusion = { workspace = true }
