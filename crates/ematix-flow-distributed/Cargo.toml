[package]
name = "ematix-flow-distributed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Distributed batch SQL execution for ematix-flow via datafusion-distributed (Σ.B). Library only — any ematix-flow process linking this crate can act as a distributed coordinator or worker."

[lib]
name = "ematix_flow_distributed"

[dependencies]
ematix-flow-core = { workspace = true }
async-trait = "0.1"
datafusion = { workspace = true }
datafusion-distributed = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
tracing = { workspace = true }
url = { workspace = true }
futures-util = { workspace = true }
# Σ.B PR 3: hosts `Worker::into_worker_server()` from the
# `flow-worker` binary so peer pods can serve distributed-plan
# stages.
tonic = { workspace = true }

[[bin]]
name = "flow-worker"
path = "src/bin/flow_worker.rs"

[dev-dependencies]
tempfile = "3"
# Σ.B PR 3 integration test: spawn N in-process workers in the test
# itself + bind to a free port via TcpListener, then connect a
# coordinator. Avoids Docker dependency for the cross-pod test.
tokio-stream = { version = "0.1", features = ["net"] }
