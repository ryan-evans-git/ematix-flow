[package]
name = "ematix-flow-distributed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Distributed batch SQL execution for ematix-flow via datafusion-distributed (Σ.B). Library only — any ematix-flow process linking this crate can act as a distributed coordinator or worker."

[lib]
name = "ematix_flow_distributed"

[dependencies]
# Production-allocator parity (used by the flow-worker bin's global_allocator;
# see src/bin/flow_worker.rs + the alloc_guard test).
mimalloc = { version = "0.1", default-features = false }
ematix-flow-core = { workspace = true }
async-trait = "0.1"
datafusion = { workspace = true }
datafusion-distributed = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
tracing = { workspace = true }
url = { workspace = true }
futures-util = { workspace = true }
# Σ.B PR 3: hosts `Worker::into_worker_server()` from the
# `flow-worker` binary so peer pods can serve distributed-plan
# stages.
#
# Σ.B follow-up: `tls-ring` enables Server::tls_config /
# ClientTlsConfig / Identity / Certificate. We pick the ring
# crypto provider over aws-lc for the lighter build and the
# pure-Rust dep tree.
tonic = { workspace = true, features = ["tls-ring"] }
# Σ.J.2.b.v — bloom_flight uses `HeaderMap`. Already a transitive dep
# via datafusion-distributed; declared here so the module compiles
# without leaning on indirect re-exports.
http = "1"
# Σ.SC I.3 — coordinator lowering (`iceberg_lower`): the coordinator names
# `iceberg::spec::DataFile` to run the manifest prune once and fan the
# survivors out as WorkUnits. Same 0.6 pin as ematix-flow-core. Optional;
# only the `iceberg` feature (off by default) pulls it, keeping the default
# build and the flow-worker image iceberg-free.
iceberg = { version = "0.6", optional = true }
# Σ.SC I.3 — tests stamp fixture DataFiles with ematix extensions
# (`encode_key_metadata`); gated with the same feature.
ematix-iceberg = { version = "0.17", optional = true }

[features]
# Iceberg manifest-prune lowering for the coordinator. Off by default —
# forwards to ematix-flow-core's `iceberg` feature (which owns the prune
# planner this module lowers from).
iceberg = ["ematix-flow-core/iceberg", "dep:iceberg", "dep:ematix-iceberg"]

[[bin]]
name = "flow-worker"
path = "src/bin/flow_worker.rs"

[dev-dependencies]
tempfile = "3"
# Allocator-parity guard (alloc_guard test in src/bin/flow_worker.rs).
libmimalloc-sys = { version = "0.1", features = ["extended"] }
# Σ.B PR 3 integration test: spawn N in-process workers in the test
# itself + bind to a free port via TcpListener, then connect a
# coordinator. Avoids Docker dependency for the cross-pod test.
tokio-stream = { version = "0.1", features = ["net"] }
# Σ.C PR 1: TPC-H bench harness for the distributed path.
criterion = { workspace = true }
# Σ.B follow-up: generate self-signed CA + server + client certs
# in-process for the TLS cross-pod test. Avoids checking PEM
# fixtures into the repo and keeps the test hermetic.
rcgen = "0.14"

[[bench]]
name = "tpch_distributed"
harness = false

[[bench]]
name = "tpch_distributed_bloom"
harness = false
