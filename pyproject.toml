[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "ematix-flow"
version = "0.12.0"
description = "Move data between databases, files, and streams from Python. Rust + Apache Arrow under the hood."
readme = "README.md"
requires-python = ">=3.10"
# PEP 639 license metadata. The previous `license = { text = ... }`
# form caused maturin to emit `License-File LICENSE` in the sdist
# PKG-INFO without actually packaging the LICENSE file — PyPI
# Warehouse rejected the v0.2.0 sdist with HTTP 400. PEP 639's
# `license-files` is the canonical fix: maturin reads it,
# includes the listed files in the sdist tarball, and the
# resulting metadata is self-consistent.
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Ryan Evans", email = "ryanevans23@gmail.com" },
]
keywords = [
    "data-engineering",
    "etl",
    "elt",
    "scd",
    "scd2",
    "data-pipeline",
    "streaming-etl",
    "change-data-capture",
    "cdc",
    "debezium",
    "datafusion",
    "apache-arrow",
    "arrow",
    "delta-lake",
    "parquet",
    "kafka",
    "kinesis",
    "pubsub",
    "rabbitmq",
    "postgres",
    "duckdb",
    "pyspark-alternative",
    "airflow-alternative",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "croniter>=2.0",
    "rich>=13",
]

[project.urls]
Repository = "https://github.com/ryan-evans-git/ematix-flow"
# Point at the rendered docs site (mkdocs-material → GitHub Pages)
# rather than the raw README. PyPI's package page is the dominant
# inbound link for new users; sending them to the doc site gives
# them search, navigation, and per-surface guides instead of a
# 900-line README.
Documentation = "https://ryan-evans-git.github.io/ematix-flow/"
Issues = "https://github.com/ryan-evans-git/ematix-flow/issues"
Changelog = "https://github.com/ryan-evans-git/ematix-flow/blob/main/CHANGELOG.md"

[project.scripts]
flow = "ematix_flow.cli:main"

[project.optional-dependencies]
df = [
    "psycopg2-binary>=2.9",
    "pyarrow>=15",
    "adbc-driver-postgresql>=1.0",
]
spark = [
    "pyspark>=3.4",
]

# ---- RunLog backend extras (Ω.D1) ---------------------------------
# Each backend gates on its own driver. SQLite + InMemory + bare path
# (the defaults) need no extra — they're stdlib-only. Install just
# what your deployment uses:
#     pip install "ematix-flow[postgres]"
#     pip install "ematix-flow[s3,gcs]"
#     pip install "ematix-flow[runlog]"   # all run-log backends
runlog-postgres = ["psycopg[binary]>=3.1"]
runlog-mysql    = ["PyMySQL>=1.1"]
runlog-duckdb   = ["duckdb>=0.10"]
runlog-s3       = ["boto3>=1.34"]
runlog-azure    = ["azure-storage-blob>=12.19"]
runlog-gcs      = ["google-cloud-storage>=2.16"]
runlog = [
    "psycopg[binary]>=3.1",
    "PyMySQL>=1.1",
    "duckdb>=0.10",
    "boto3>=1.34",
    "azure-storage-blob>=12.19",
    "google-cloud-storage>=2.16",
]

# ---- Observability extras (Ω.Q3 + Ω.M1) ---------------------------
# StdoutAlerter and the simple metrics sinks (Null/Stdout/InMemory)
# are stdlib-only. SlackAlerter uses stdlib urllib so it has no extra
# dep either. The Prometheus and OpenTelemetry sinks are the only
# ones that pull in real packages.
metrics-prometheus = ["prometheus_client>=0.19"]
metrics-otel = [
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
]
metrics = [
    "prometheus_client>=0.19",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
]
observability = [
    "prometheus_client>=0.19",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
]

# ---- Executor extras (Ω.W) -----------------------------------------
# SubprocessExecutor is stdlib-only. K8sJobExecutor and LambdaExecutor
# pull in their respective cloud SDKs as opt-in extras.
executor-k8s = ["kubernetes>=29"]
executor-lambda = ["boto3>=1.34"]

# ---- Secrets-resolver extras (Phase 1 — pluggable secrets) ---------
# The EnvResolver is stdlib-only. The three external-store resolvers
# pull their respective SDKs as opt-in extras. Users register the
# matching resolver at app bootstrap; see
# ``python/ematix_flow/secrets.py`` and docs/USER_GUIDE.md.
secrets-vault       = ["hvac>=2.0"]
secrets-aws         = ["boto3>=1.34"]
secrets-gcp         = ["google-cloud-secret-manager>=2.16"]
secrets = [
    "hvac>=2.0",
    "boto3>=1.34",
    "google-cloud-secret-manager>=2.16",
]

# ---- AWS Glue Schema Registry extra -------------------------------
# Confluent / Apicurio SRs ride the existing `kind = "schema_registry"`
# surface. Glue uses a different wire format (0x03 header + UUID +
# codec byte) and AWS IAM auth, so it ships as a separate connection
# kind with its own opt-in SDK dependency. See
# ``crates/ematix-flow-core/src/glue_schema_registry.rs`` for the
# framing primitives.
schema-registry-glue = [
    "boto3>=1.34",
    "aws-glue-schema-registry>=1.1; platform_python_implementation == 'CPython'",
]

# ---- Web UI extras (Phase 4 — flow web subcommand) -----------------
# FastAPI + uvicorn server + embedded Vite/Svelte SPA bundle. The
# Python wheel ships the pre-built SPA in `ematix_flow/web/ui_dist/`
# at build time so `flow web` works out of the box.
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

# ---- AWS Glue Schema Registry (task #556)
# boto3 — Glue's GetSchemaVersion / RegisterSchemaVersion / CreateSchema
# calls. Only the schema fetch+register lives in Python; the Kafka
# wire-frame primitives are in the Rust crate.
glue-schema-registry = [
    "boto3>=1.34",
]

# ---- Cloud warehouse extras (Phase 2 — Snowflake / BigQuery / Redshift)
# Each warehouse's typed Connection + the matching `*_query_to_arrow`
# adapter pulls the upstream Python SDK as an opt-in extra. The
# Connection dataclasses themselves are stdlib-only; install the
# extra only when you actually need to talk to that warehouse.
snowflake = [
    "snowflake-connector-python>=3.7",
    # Arrow-native PUT + COPY INTO path — no pandas dep.
    "pyarrow>=15",
]
bigquery  = [
    "google-cloud-bigquery>=3.17",
    "google-cloud-bigquery-storage>=2.24",
    # Arrow-native load_table_from_file(PARQUET) path — no pandas dep.
    "pyarrow>=15",
]
redshift  = [
    "redshift-connector>=2.1",
    "boto3>=1.34",
    # Arrow-native S3 + COPY FROM ... PARQUET path — no pandas dep.
    "pyarrow>=15",
]
warehouses = [
    "snowflake-connector-python>=3.7",
    "google-cloud-bigquery>=3.17",
    "google-cloud-bigquery-storage>=2.24",
    "redshift-connector>=2.1",
    "boto3>=1.34",
    "pyarrow>=15",
]

# Convenience: everything ematix-flow can plug into. Heavy install
# — use targeted extras above in production.
all = [
    "psycopg2-binary>=2.9",
    "pyarrow>=15",
    "adbc-driver-postgresql>=1.0",
    "psycopg[binary]>=3.1",
    "PyMySQL>=1.1",
    "duckdb>=0.10",
    "boto3>=1.34",
    "azure-storage-blob>=12.19",
    "google-cloud-storage>=2.16",
    "prometheus_client>=0.19",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
    "kubernetes>=29",
]

dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "testcontainers[postgres]>=4.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "maturin>=1.7",
    "polars>=1.0",
    "pandas>=2.0",
    "psycopg2-binary>=2.9",
    "numpy>=1.26",
    # Optional backends — installed in dev so the full test matrix
    # runs locally + in CI.
    "psycopg[binary]>=3.1",
    "PyMySQL>=1.1",
    "duckdb>=0.10",
    "boto3>=1.34",
    "moto[s3]>=5.0",
    "azure-storage-blob>=12.19",
    "google-cloud-storage>=2.16",
    "prometheus_client>=0.19",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
]

[tool.maturin]
manifest-path = "crates/ematix-flow-py/Cargo.toml"
module-name = "ematix_flow._core"
python-source = "python"
features = ["pyo3/extension-module"]
strip = true

[tool.ruff]
# `target-version = "py311"` matches the actual tested matrix:
# ci.yml runs 3.11 + 3.12, release.yml builds 3.11/3.12/3.13 wheels.
# `requires-python = ">=3.10"` stays for sdist compatibility — 3.10
# users `pip install` from sdist, but we don't lint-target it. One
# concrete reason: `tests/python/test_phase8_scd2.py` uses an
# f-string backslash-escape that ruff rejects on py310 but Python
# 3.12+ accepts.
line-length = 100
target-version = "py311"
src = ["python", "tests/python"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001 / RUF002 / RUF003: "ambiguous unicode character in string /
# docstring / comment" — fires on em-dashes (—), smart-quotes, and
# multiplication sign (×) we use stylistically across the codebase
# (e.g. `"3× faster"` in benchmark output strings). They aren't
# ambiguous in our context; the rule would force a project-wide
# rewrite for no readability gain.
#
# SIM105 (`contextlib.suppress` vs `try/except: pass`) and SIM108
# (`if/else` vs ternary expression) are both pure-style preferences
# the community is split on — neither is more correct, and forcing
# them across the codebase produces churn without a readability win.
ignore = ["RUF001", "RUF002", "RUF003", "SIM105", "SIM108"]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally use looser conventions that the production code
# tree doesn't:
#  - E501: long inline SQL fragments and assertion messages.
#  - F841: bound-but-unused names that document a fixture's API
#    surface (e.g., `def test_x(pg_session, _other): ...`).
#  - B017 / RUF043: `pytest.raises(Exception)` and non-regex `match=`
#    patterns are common in negative-path tests.
#  - RUF059: unpacked tuples where one side is intentionally ignored.
#  - SIM101: chained isinstance checks kept verbose for readability
#    in test parametrization.
"tests/**/*.py" = ["E501", "F841", "B017", "RUF043", "RUF059", "SIM101"]

[tool.bandit]
# `tests/python` exercises framework-internal SQL builders + uses
# fixture passwords like "s3cret"; bandit flags those at ~24 medium
# severity. Skip the test tree from the security scan.
exclude_dirs = ["tests"]
skips = [
    # B608 — "hardcoded SQL expressions". Every match is a framework
    # SQL builder interpolating *identifiers* (schema / table /
    # column names that come from `@ematix.table` declarations) and
    # *pre-escaped literals* (watermark literal goes through
    # `_build_last_value_literal`, which `''`-escapes the value and
    # casts to a typed SQL type). Identifiers can't be parameterized
    # in SQL — same architectural pattern as dbt / sqlmesh / every
    # other ETL framework. Flagging here would be one warning per
    # query builder forever.
    "B608",
    # B307 — `eval()` in `decorators.py::ematix.table` evaluates PEP
    # 593 annotation strings (e.g. `"BigInt"`) in the user's own
    # module globals. Same risk surface as `typing.get_type_hints`
    # (which also evals string annotations). Trust boundary: the
    # developer writing their own class — not external input.
    "B307",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
markers = [
    "integration: requires a live Postgres (slow, opt-in)",
    "spark: requires pyspark + a Postgres JDBC jar (slow, opt-in)",
]
addopts = "-ra --strict-markers -m 'not integration and not spark'"
