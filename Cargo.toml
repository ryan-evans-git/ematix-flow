[workspace]
resolver = "3"
members = [
    "crates/ematix-flow-core",
    "crates/ematix-flow-py",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/ryan-evans-git/ematix-flow"
authors = ["Ryan Evans <ryanevans23@gmail.com>"]

[workspace.dependencies]
ematix-flow-core = { path = "crates/ematix-flow-core" }
pyo3 = { version = "0.28", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-serde_json-1"] }
deadpool-postgres = "0.14"
uuid = { version = "1", features = ["v4", "v7"] }
futures-util = "0.3"
bytes = "1"
arrow-array = "58"
arrow-schema = "58"
arrow-csv = "58"
arrow-json = "58"
# orc-rust 0.8 (and onward) tracks arrow 58. Phase 35a workspace bump
# brought us here so deltalake / iceberg can share the ABI. 0.8 also
# adds `into_inner` on ArrowWriter, dropping the `Arc<Mutex<Vec<u8>>>`
# wrapper we needed on 0.6.
orc-rust = { version = "0.8", default-features = false }
# Apache Arrow object_store + parquet — kept on the same major track
# as arrow-array (58.x) so the Arrow ABI matches across crates.
object_store = { version = "0.13", features = ["aws"] }
parquet = { version = "58", features = ["arrow", "async", "object_store"] }
# Add UUIDv7 feature for sortable file names (`<prefix>/<uuid7>.parquet`).
# Already in the workspace at v1; the v7 feature is a flag flip.
# DuckDB switched to calendar-versioned releases (1.X.Y → 1.YYYYMM.Z).
# 1.10502 is the first release on arrow 58; older 1.4 is on arrow 56.
# `bundled` compiles DuckDB from source on the first build (~3–5 min,
# one-time); subsequent builds are cached.
duckdb = { version = "1.10502", features = ["bundled", "appender-arrow"] }
# `bundled` compiles SQLite from source so we don't depend on a system
# install. `chrono` enables ToSql for chrono types (used for ISO-8601
# timestamps); `uuid` enables ToSql for uuid::Uuid. Arrow conversion is
# done manually — rusqlite has no Arrow feature.
rusqlite = { version = "0.31", features = ["bundled", "chrono", "uuid", "column_decltype", "functions"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres", "mysql", "minio"] }
mysql_async = { version = "0.36", default-features = false, features = ["minimal-rust", "rustls-tls"] }
# Delta Lake (Phase 35). Pulls in DataFusion + arrow 58 + parquet 58
# from the same arrow-rs major track as our pinned ones. `rustls`
# feature is required (deltalake compile_errors without one of
# rustls/native-tls).
deltalake = { version = "0.32", default-features = false, features = ["rustls", "datafusion"] }
# `url` is needed to construct deltalake's `Url` parameter; deltalake
# doesn't re-export it. Already pulled in transitively, so this just
# brings it into the workspace's direct namespace.
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
