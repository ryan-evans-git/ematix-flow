[workspace]
resolver = "3"
members = [
    "crates/ematix-flow-core",
    "crates/ematix-flow-py",
    "crates/ematix-flow-cli",
    "crates/ematix-flow-distributed",
]

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/ryan-evans-git/ematix-flow"
authors = ["Ryan Evans <ryanevans23@gmail.com>"]

[workspace.dependencies]
ematix-flow-core = { path = "crates/ematix-flow-core" }
ematix-flow-cli = { path = "crates/ematix-flow-cli" }
ematix-flow-distributed = { path = "crates/ematix-flow-distributed" }
pyo3 = { version = "0.28", features = ["extension-module"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-serde_json-1"] }
deadpool-postgres = "0.14"
uuid = { version = "1", features = ["v4", "v7"] }
futures-util = "0.3"
# flate2 — zlib decompress for AWS Glue Schema Registry payloads
# (compression_type=ZLIB). Already in the dep tree transitively via
# parquet's codec support; declaring it here as a workspace dep so
# ematix-flow-core can use it directly for Kafka Glue dispatch.
flate2 = "1"
bytes = "1"
arrow-array = "58"
arrow-schema = "58"
arrow-csv = "58"
arrow-json = "58"
arrow-cast = "58"
# Umbrella `arrow` crate, used only by the Python bindings for the
# `pyarrow` feature (FFI conversion between arrow-rs RecordBatch
# and PyArrow). Pinned to the same major track as the split arrow-*
# crates above so the ABI matches.
arrow = { version = "58", features = ["pyarrow"] }
# orc-rust 0.8 (and onward) tracks arrow 58. Phase 35a workspace bump
# brought us here so deltalake / iceberg can share the ABI. 0.8 also
# adds `into_inner` on ArrowWriter, dropping the `Arc<Mutex<Vec<u8>>>`
# wrapper we needed on 0.6.
orc-rust = { version = "0.8", default-features = false }
# Apache Arrow object_store + parquet — kept on the same major track
# as arrow-array (58.x) so the Arrow ABI matches across crates.
object_store = { version = "0.13", features = ["aws"] }
parquet = { version = "58", features = ["arrow", "async", "object_store"] }
# Add UUIDv7 feature for sortable file names (`<prefix>/<uuid7>.parquet`).
# Already in the workspace at v1; the v7 feature is a flag flip.
# DuckDB switched to calendar-versioned releases (1.X.Y → 1.YYYYMM.Z).
# 1.10502 is the first release on arrow 58; older 1.4 is on arrow 56.
# `bundled` compiles DuckDB from source on the first build (~3–5 min,
# one-time); subsequent builds are cached.
duckdb = { version = "1.10502", features = ["bundled", "appender-arrow"] }
# `bundled` compiles SQLite from source so we don't depend on a system
# install. `chrono` enables ToSql for chrono types (used for ISO-8601
# timestamps); `uuid` enables ToSql for uuid::Uuid. Arrow conversion is
# done manually — rusqlite has no Arrow feature.
rusqlite = { version = "0.31", features = ["bundled", "chrono", "uuid", "column_decltype", "functions"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres", "mysql", "minio", "kafka", "rabbitmq", "google_cloud_sdk_emulators", "localstack"] }
mysql_async = { version = "0.36", default-features = false, features = ["minimal-rust", "rustls-tls"] }
# Delta Lake (Phase 35). Pulls in DataFusion + arrow 58 + parquet 58
# from the same arrow-rs major track as our pinned ones. `rustls`
# feature is required (deltalake compile_errors without one of
# rustls/native-tls).
deltalake = { version = "0.32", default-features = false, features = ["rustls", "datafusion", "s3"] }
# DataFusion (Π.4b-1: SQL transforms + stream-table joins). Pinned
# to the same minor as deltalake's transitive dep so they share one
# arrow ABI. Adding as a direct dep so we can use SessionContext /
# MemTable / DataFrame APIs from the transform layer.
datafusion = { version = "53.1", default-features = false, features = ["parquet"] }
# Σ.D3: cranelift JIT for the unified `FusedAggregateExec` fast path.
# At plan time we emit machine code for the specific predicate +
# aggregate shape; the resulting function runs the inner loop with
# no per-clause dispatch — same performance as the hardcoded Σ.D1 /
# Σ.D2 specialty operators, for arbitrary plan shapes. Pinned with
# the same 0.107 series across both sub-crates to avoid duplicate
# code-generation backends in the binary.
cranelift = "0.107"
cranelift-codegen = "0.107"
cranelift-frontend = "0.107"
cranelift-jit = "0.107"
cranelift-module = "0.107"
cranelift-native = "0.107"
# Σ.B PR 2: distributed batch SQL execution. `datafusion-contrib`
# library that adds peer-to-peer distributed execution via Arrow
# Flight, with no separate scheduler/executor binaries — any ematix-
# flow process linking this crate can act as either coordinator or
# worker. Pinned to the 1.x line which targets DataFusion 53; the
# original spike named Ballista (separate scheduler+executor binaries),
# but Ballista 52 pins DataFusion ^52 which is incompatible with the
# workspace's DataFusion 53.1. See
# `docs/PHASE_SIGMA_B_TRAIT_SPIKE.md` "PR 2 distributed-engine
# pivot" for the rationale.
datafusion-distributed = "1"
# Σ.B PR 3: gRPC transport for the `flow-worker` binary that hosts
# `datafusion_distributed::Worker::into_worker_server()`. Pinned to
# 0.14 to match the version datafusion-distributed 1.0 uses
# transitively — sharing one tonic ABI across the workspace.
tonic = { version = "0.14", features = ["transport"] }
# Kafka (Phase 36). FFI to librdkafka. The `cmake-build` feature
# compiles librdkafka from source (slow first build, but no system
# library required) — keeps CI portable. Default features (libz,
# tokio) cover gzip + tokio integration.
#
# manylinux2014 is intentionally minimal — none of libsasl2-dev,
# libcurl-dev, or libssl-dev are pre-installed. We vendor each:
#
# - `sasl2-sys/plain,scram` (declared as a separate workspace dep
#   below) for libsasl2.
# - `curl-static` here for libcurl. (Required because librdkafka
#   2.12+'s `rdkafka_conf.c` does `#include <curl/curl.h>`
#   unconditionally — even with cmake `-DWITH_CURL=0`. We don't
#   actually use librdkafka's curl-based OIDC OAuth path; MSK IAM
#   goes through `aws-msk-iam-sasl-signer`'s rust-side callback.
#   The static curl satisfies the header requirement.)
# - `ssl-vendored` for openssl (transitive via `openssl-sys/vendored`).
#
# Net effect: a fully self-contained wheel, no runtime libsasl2 /
# libcurl / libssl dependencies on consumer machines. ~3–5MB
# heavier wheel but equivalent in functionality.
rdkafka = { version = "0.39", features = ["cmake-build", "ssl-vendored", "sasl", "curl-static"] }
# rdkafka's `sasl` feature pulls in `sasl2-sys` (transitively via
# rdkafka-sys's `gssapi` feature → `sasl2-sys`). Without explicit
# vendoring, that crate's build script looks for system libsasl2
# (libsasl2-dev on Debian, cyrus-sasl-devel on RHEL) at compile
# time — which fails inside the manylinux2014 wheel-build
# container. Declaring sasl2-sys here as a direct dep with the
# `plain` + `scram` features (each transitively activates
# `vendored`) tells the resolver to bundle libsasl2 statically
# into the wheel, with PLAIN + SCRAM mechanisms compiled in. No
# runtime libsasl2 install required on consumer machines.
sasl2-sys = { version = "0.1.22", features = ["plain", "scram"] }
# AWS MSK IAM token signer (Phase 36f). librdkafka itself doesn't
# know how to mint MSK IAM tokens — it asks the rust-side via the
# OAUTHBEARER refresh callback, and we hand it back a presigned
# AWS-SigV4 URL. This crate generates that URL using the AWS
# credential chain.
aws-msk-iam-sasl-signer = "1"
# `Region` ctor for the signer above. It's already a transitive dep
# of aws-msk-iam-sasl-signer; we declare it directly here so the
# import isn't accidental.
aws-types = "1"
# Prometheus metrics (Phase 36i). Process-side counters for streaming
# pipelines; exposed via a tiny built-in /metrics HTTP endpoint.
prometheus = "0.14"
# Confluent Schema Registry client (Phase 36h.3+). Pulls in the
# avro codec via apache-avro and an http client (reqwest) for the
# SR REST API. `easy` features the high-level decoder/encoder; we
# use the async variant for tokio integration.
schema_registry_converter = { version = "4.8", default-features = false, features = ["futures", "native_tls", "avro", "easy", "proto_decoder", "proto_raw"] }
# Apache Avro Value type + Schema; used by the Avro→JSON
# converter that bridges decoded Avro values into our existing
# arrow-json decode path.
apache-avro = "0.21"
# Protobuf reflective decoder used by the SR proto_decoder
# feature. Brought in transitively by schema_registry_converter
# but declared directly so we can import its `Context`,
# `MessageValue`, and `Value` types into our protofish→JSON
# converter (Phase 36h.5).
protofish = { version = "0.5", default-features = false }
# RabbitMQ AMQP 0.9.1 client (Phase 37a). `lapin` is the de-facto
# pure-rust client; rustls-only feature footprint to match other
# rustls-using deps in this workspace (mysql_async, deltalake).
lapin = { version = "2", default-features = false, features = ["rustls"] }
# GCP Pub/Sub gRPC client (Phase 37b). The canonical
# google-cloud-rust crate. Honors `PUBSUB_EMULATOR_HOST` /
# `PUBSUB_PROJECT_ID` envs in dev so the same code path drives the
# emulator-backed Docker integration test as well as production
# Pub/Sub. We pin a major-stable line; the crate is on the
# google-cloud-rust ecosystem's release train.
google-cloud-pubsub = { version = "0.33", default-features = false, features = ["default-rustls-provider"] }
# Brought in transitively by google-cloud-pubsub for ADC; declared
# directly so the backend can construct anonymous credentials
# (emulator path) without going through pubsub's re-exports.
google-cloud-auth = { version = "1", default-features = false }
# AWS SDK for Kinesis (Phase 37c). Pulls in the AWS smithy/runtime
# stack; aws-config handles credential resolution + region from env
# / IMDS / shared-config / static credentials. Both pinned to the
# 1.x major track that matches the rest of the workspace's
# aws-types pin.
aws-sdk-kinesis = { version = "1", default-features = false, features = ["rt-tokio", "rustls"] }
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "rustls", "behavior-version-latest"] }
aws-credential-types = { version = "1", default-features = false }
# CLI deps (Phase 38 / `flow` binary).
clap = { version = "4", features = ["derive"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# CLI.2: tiny HTTP server for the /metrics endpoint. axum 0.8
# already shares hyper with our other deps (aws-sdk-*, tonic via
# google-cloud-pubsub), so the dep cost is mostly compile-time.
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
# `url` is needed to construct deltalake's `Url` parameter; deltalake
# doesn't re-export it. Already pulled in transitively, so this just
# brings it into the workspace's direct namespace.
url = "2"
# Criterion bench harness (Phase 39.1 acceptance criteria for the
# transform layer — see docs/SQL_TRANSFORMS_PLAN.md).
criterion = { version = "0.5", default-features = false, features = ["async_tokio"] }
# Phase 39.4 PR 2b: HyperLogLog+ approximate distinct counting for
# `count_distinct` aggregator. ~16 KB sketch per group at p=14;
# ~0.81% standard error. Pure Rust; no external service.
hyperloglogplus = "0.4"
# Phase 39.5a PR 3: postcard for serializing per-key session state
# blobs into the StateStore. Compact (within a few % of bincode),
# schema-stable (explicit append-only field rules), pure Rust.
postcard = { version = "1", features = ["alloc"] }
# Σ.A1 PR 1: TPC-H benchmark data generator. Pure Rust, byte-for-byte
# compatible with the TPC.org reference `dbgen` (verified per-checkin
# upstream). Includes Q1–Q22 reference answers at SF=1 for smoke-test
# correctness gates. Used only by tests, benches, and the generator
# example binary; not in the runtime path.
#
# We deliberately use only the core `tpchgen` crate (no arrow deps),
# not `tpchgen-arrow`: tpchgen-arrow 2.0.2 pins `arrow ^57.1`, but the
# workspace is on the arrow 58 ABI track (driven by orc-rust 0.8 +
# deltalake 0.32 + parquet 58). Mixing arrow majors fails at the
# `RecordBatch` type boundary. We pay ~10–20s extra at SF=1 to route
# through `tpchgen::csv` → `arrow_csv::ReaderBuilder` (our pinned
# arrow-csv 58); fine for the smoke test. Re-evaluate when
# tpchgen-arrow lands an arrow-58 release.
tpchgen = "2"
# Σ.A2 PR 2: AST-rewrite SQL dialect translator. sqlparser 0.61 is
# what DataFusion 53.1 pulls in transitively; promoted to a direct
# workspace dep here so we can call `Parser::parse_sql(&dialect, sql)`
# and re-emit via `Statement::to_string()`. The `visitor` feature
# turns on the `VisitMut` derive macros for AST walkers. Pin tight
# to DataFusion's transitive version — mismatched sqlparser majors
# break ABI on shared AST types.
sqlparser = { version = "0.61", features = ["visitor"] }

[profile.release]
lto = "thin"
codegen-units = 1

# ematix-parquet v0.16.1 on crates.io as of 2026-05-25. Bumped from
# v0.15.0 to pick up the sidecar-index capability (Π.17–Π.20: sorted /
# Bloom / composite / inverted-text indexes) and the `ematix-iceberg`
# crate (Π.21–Π.22: manifest walker + file-level prune). flow-core's
# `ematix-parquet-* = "0.16"` pin resolves directly from the registry.
# ematix-iceberg is intentionally NOT yet a flow-side dep — Phase 3+
# of docs/plans/CURRENT.md will wire it in when we surface Iceberg-
# managed tables.
