[workspace]
resolver = "3"
members = [
    "crates/ematix-flow-core",
    "crates/ematix-flow-py",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/ryan-evans-git/ematix-flow"
authors = ["Ryan Evans <ryanevans23@gmail.com>"]

[workspace.dependencies]
ematix-flow-core = { path = "crates/ematix-flow-core" }
pyo3 = { version = "0.28", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-serde_json-1"] }
deadpool-postgres = "0.14"
uuid = { version = "1", features = ["v4", "v7"] }
futures-util = "0.3"
bytes = "1"
arrow-array = "56"
arrow-schema = "56"
arrow-csv = "56"
arrow-json = "56"
# orc-rust 0.6 is the last release pinned to arrow 56.x. 0.7+ moved to
# arrow 57/58, which would conflict with our pinned 56 ABI (RecordBatch
# would be a different type across crates). Bumping the whole workspace
# to arrow 58 is its own future phase; until then, 0.6.3 covers ORC.
orc-rust = { version = "0.6", default-features = false }
# Apache Arrow object_store + parquet — kept on the same major version
# track as arrow-array (56.x) so the Arrow ABI matches across crates.
object_store = { version = "0.12", features = ["aws"] }
parquet = { version = "56", features = ["arrow", "async", "object_store"] }
# Add UUIDv7 feature for sortable file names (`<prefix>/<uuid7>.parquet`).
# Already in the workspace at v1; the v7 feature is a flag flip.
# DuckDB pinned so the bundled C source matches the arrow-array version.
# `bundled` compiles DuckDB from source on the first build (~3-5 min,
# one-time); subsequent builds are cached. This avoids depending on a
# system DuckDB install for CI.
duckdb = { version = "1.4", features = ["bundled", "appender-arrow"] }
# `bundled` compiles SQLite from source so we don't depend on a system
# install. `chrono` enables ToSql for chrono types (used for ISO-8601
# timestamps); `uuid` enables ToSql for uuid::Uuid. Arrow conversion is
# done manually — rusqlite has no Arrow feature.
rusqlite = { version = "0.31", features = ["bundled", "chrono", "uuid", "column_decltype", "functions"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres", "mysql", "minio"] }
mysql_async = { version = "0.36", default-features = false, features = ["minimal-rust", "rustls-tls"] }

[profile.release]
lto = "thin"
codegen-units = 1
