[workspace]
resolver = "3"
members = [
    "crates/ematix-flow-core",
    "crates/ematix-flow-py",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/ryan-evans-git/ematix-flow"
authors = ["Ryan Evans <ryanevans23@gmail.com>"]

[workspace.dependencies]
ematix-flow-core = { path = "crates/ematix-flow-core" }
pyo3 = { version = "0.28", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-serde_json-1"] }
deadpool-postgres = "0.14"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
bytes = "1"
arrow-array = "56"
arrow-schema = "56"
# DuckDB pinned so the bundled C source matches the arrow-array version.
# `bundled` compiles DuckDB from source on the first build (~3-5 min,
# one-time); subsequent builds are cached. This avoids depending on a
# system DuckDB install for CI.
duckdb = { version = "1.4", features = ["bundled", "appender-arrow"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }

[profile.release]
lto = "thin"
codegen-units = 1
