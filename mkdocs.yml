site_name: ematix-flow
# Plain-English value line. Used as the default `<meta
# name="description">` (Google search snippet, ~155 char budget)
# AND as the fallback `og:description` if the per-page front-matter
# doesn't override it. Keep this readable for non-engineers — it's
# the line that decides whether someone clicks the SERP result.
site_description: >
  Move data between databases, files, and streams from Python.
  5.87× faster than PySpark. No JVM needed.
site_url: https://ryan-evans-git.github.io/ematix-flow/
repo_url: https://github.com/ryan-evans-git/ematix-flow
repo_name: ryan-evans-git/ematix-flow
edit_uri: edit/main/docs/

# `docs_dir` matches the existing on-disk layout. The README at the
# repo root becomes the site index via the `extra-files` plugin
# below; everything under docs/ is served at /<basename>/.
docs_dir: docs

# The repo's docs/ tree also holds ~100 internal engineering artifacts
# (Σ/REV phase plans, PERF_* reviews, plans/archive/*) that cross-link
# heavily and aren't part of the published site. Build + link-check only
# the curated nav pages; everything else is excluded (gitignore-style:
# drop all .md, then re-include the nav set). This keeps `--strict` green
# and the public site focused on user-facing docs.
exclude_docs: |
  *.md
  !index.md
  !USER_GUIDE.md
  !ROADMAP.md
  !RELEASE.md
  !PRD.md
  !IMPLEMENTATION_PLAN.md
  !MULTI_BACKEND_PLAN.md
  !ERGONOMICS_PLAN.md
  !ML_FEATURE_STORE_PLAN.md
  !NORMALIZATION_TRANSFORMS_PLAN.md
  !SQL_TRANSFORMS_PLAN.md
  !PHASE_39_4_WINDOWS.md
  !PHASE_39_5_SESSIONS.md
  !PHASE_39_5B_JOINS.md
  !UNIFIED_PIPELINE_API.md
  !ICEBERG_PLAN.md
  !CICD_PLAN.md

theme:
  name: material
  # Custom partial template overrides (live in /overrides/). Used
  # to inject Google Search Console + Bing Webmaster verification
  # meta tags into <head> — see overrides/main.html for the
  # one-time setup steps. Tokens are commented out by default so
  # the deployed HTML is clean until real values land.
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true

plugins:
  - search
  # `include-readme`-style plugin would let the repo README serve
  # as the index. Skipped on first cut to keep the plugin set
  # small; an `index.md` shim under docs/ does the same job.

nav:
  - Home: index.md
  - User guide: USER_GUIDE.md
  - Roadmap: ROADMAP.md
  - Cutting a release: RELEASE.md

  - Reference designs:
    - PRD (v0.1): PRD.md
    - Implementation plan: IMPLEMENTATION_PLAN.md
    - Multi-backend: MULTI_BACKEND_PLAN.md
    - Ergonomics (decorator API): ERGONOMICS_PLAN.md
    - ML feature store: ML_FEATURE_STORE_PLAN.md
    - Normalization + transforms: NORMALIZATION_TRANSFORMS_PLAN.md

  - Phase 39 — stream processing:
    - SQL transforms umbrella: SQL_TRANSFORMS_PLAN.md
    - Tumbling + hopping windows: PHASE_39_4_WINDOWS.md
    - Session windows + StateStore: PHASE_39_5_SESSIONS.md
    - Stream-stream join: PHASE_39_5B_JOINS.md

  - Future / deferred:
    - Unified pipeline API: UNIFIED_PIPELINE_API.md
    - Iceberg backend: ICEBERG_PLAN.md
    - CI/CD plan: CICD_PLAN.md
